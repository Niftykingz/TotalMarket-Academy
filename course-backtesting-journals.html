const lessons=[["What is backtesting?","Backtesting applies predefined trading rules to historical data. It can expose weaknesses but cannot guarantee future returns.","Test 100 historical signals using fixed entry and stop rules, not hindsight-selected winners.",[100,105,102,108,104,110,107,112,109,115,113],105],["Avoid look-ahead bias","A backtest must use only information that would have been known when each decision was made.","Do not use Friday closing data to justify a trade supposedly entered Wednesday morning.",[100,102,104,103,107,109,106,111,113,112,115],107],["Include trading costs","Brokerage, fees, taxes, slippage and spread can change strategy profitability.","40 trades × ₹80 total estimated friction = ₹3,200 cost; a ₹2,500 gross gain becomes ₹700 net loss.",[100,102,99,103,101,104,100,105,103,106,104],103],["Win rate versus payoff","A strategy can win less than half its trades and still be profitable if average wins exceed average losses.","40 wins × ₹2,000 − 60 losses × ₹1,000 = ₹20,000 before costs.",[100,98,103,101,105,102,107,104,109,106,111],105],["Expectancy","Expectancy = win probability × average win − loss probability × average loss, before costs.","40% win rate × ₹2,000 − 60% × ₹1,000 = ₹200 expected gross per trade.",[100,101,103,102,104,105,103,107,106,108,109],104],["Drawdown","Drawdown measures a fall from a prior equity peak; assess both magnitude and duration.","Capital peaks at ₹1,00,000 and drops to ₹82,000: drawdown = 18%.",[90,95,100,97,93,88,82,86,91,94,98],100],["Trade journal","Log entry reason, planned risk, actual execution, result and whether rules were followed.","Journal: entry ₹210, stop ₹205, exit ₹218, quantity 100, gross profit ₹800 before costs.",[200,205,210,207,212,216,214,218,217,219,221],210],["Practice","A useful backtest separates training and evaluation periods and includes realistic costs.","A strategy earns ₹10,000 gross on historical trades but pays ₹12,000 friction. Net result is −₹2,000.",[100,102,101,103,102,104,103,105,104,106,105],103]];let current=0;const el=id=>document.getElementById(id);
function chart(l){const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 680 345");svg.setAttribute("role","img");svg.setAttribute("aria-label","Illustrative diagram for "+l[0]);const add=(tag,attrs,t)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));if(t!==undefined)n.textContent=t;svg.append(n)};const prices=l[3],level=l[4],lo=Math.min(...prices,level===null?Infinity:level),hi=Math.max(...prices,level===null?-Infinity:level),range=Math.max(12,hi-lo),bottom=lo-range*.2,top=hi+range*.2,x=i=>55+i*53,y=v=>283-(v-bottom)/(top-bottom)*232;add("rect",{width:680,height:345,fill:"#fff"});for(let i=0;i<5;i++){const v=bottom+(top-bottom)*i/4;add("line",{x1:46,y1:y(v),x2:616,y2:y(v),stroke:"#e1e8ed"});add("text",{x:623,y:y(v)+5,fill:"#3b5264","font-size":13},""+Math.round(v))}if(level!==null){add("line",{x1:46,y1:y(level),x2:616,y2:y(level),stroke:"#17202b","stroke-width":2,"stroke-dasharray":"8 6"});add("text",{x:52,y:Math.max(16,y(level)-10),fill:"#17202b","font-size":13,"font-weight":700},"REFERENCE "+level)}add("polyline",{points:prices.map((v,i)=>x(i)+","+y(v)).join(" "),stroke:"#466ce8","stroke-width":5,fill:"none","stroke-linejoin":"round","stroke-linecap":"round"});add("text",{x:50,y:331,fill:"#476274","font-size":12},"EARLIER");add("text",{x:550,y:331,fill:"#476274","font-size":12},"LATER →");const f=document.createElement("figure");f.className="chart";f.append(svg);const cap=document.createElement("figcaption");cap.textContent="Illustrative blue-line diagram; vertical values represent the lesson example, not live prices. Dashed line marks a reference value.";f.append(cap);return f}
function render(){const l=lessons[current];el("count").textContent="STEP "+(current+1)+" OF "+lessons.length;el("label").textContent=l[0];el("fill").style.width=(100*(current+1)/lessons.length)+"%";const body=el("body");body.replaceChildren();const h=document.createElement("h2");h.textContent=l[0];const p=document.createElement("p");p.className="definition";p.textContent=l[1];const ex=document.createElement("aside");ex.className="example";const strong=document.createElement("strong");strong.textContent="→ PRACTICAL ₹ EXAMPLE";const ep=document.createElement("p");ep.textContent=l[2];ex.append(strong,ep);body.append(h,p,chart(l),ex);if(current===7){const q=document.createElement("section");q.className="quiz";const title=document.createElement("h3");title.textContent="Which approach is most reliable?";q.append(title);const feedback=document.createElement("p");feedback.setAttribute("role","status");["One chart signal guarantees a profit","Combine context, predefined risk and evidence","Increase risk after every loss"].forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>feedback.textContent=i===1?"Correct. Evidence, a clear plan and controlled risk matter; outcomes remain uncertain.":"Try again: no single indicator guarantees profit.";q.append(b)});q.append(feedback);body.append(q)}el("prev").disabled=current===0;el("next").textContent=current===7?"Restart ↻":"Next →";window.scrollTo(0,0)}
el("prev").onclick=()=>{if(current>0){current--;render()}};el("next").onclick=()=>{current=(current+1)%lessons.length;render()};render();
