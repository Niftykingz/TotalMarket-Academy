<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07503b"><meta name="description" content="Multi-Timeframe Analysis: eight illustrated lessons with Indian rupee examples and interactive knowledge checks."><title>Multi-Timeframe Analysis | TotalMarket Academy</title><link rel="stylesheet" href="styles.css"><style>body{background:#f7faf7;color:#153d2e}.head{background:#07503b;color:white;padding:18px}.head a{color:#c8f5d9;font-weight:800}.shell{max-width:830px;margin:auto;padding:25px 16px 60px}.shell h1{font-size:clamp(28px,5vw,43px);color:#0b4430}.lead{color:#537163;line-height:1.7}.panel{background:white;border:1px solid #d9e7de;border-radius:18px;padding:clamp(18px,4vw,35px);margin-top:22px}.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#597466}.track{background:#e3efe7;height:7px;border-radius:20px;overflow:hidden;margin:14px 0 25px}.fill{background:#138553;height:100%}h2{color:#103e2d}.definition{font-size:17px;line-height:1.7}.chart{border:1px solid #d7e3dd;border-radius:12px;margin:20px 0;padding:4px;background:white}.chart svg{width:100%;height:auto;display:block}.chart figcaption{font-size:12px;color:#526b5d;padding:7px;line-height:1.5}.example{border-left:4px solid #168554;background:#edf8f0;padding:16px;margin:20px 0;border-radius:0 9px 9px 0;line-height:1.7}.example strong{color:#0b6b47}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.nav button,.quiz button{border:1px solid #c4d8ca;background:white;border-radius:9px;padding:13px 19px;font-weight:750;color:#0c4c34}.nav button:last-child{background:#0b6748;color:white}.nav button:disabled{opacity:.4}.quiz button{display:block;width:100%;text-align:left;margin:9px 0}.quiz p{font-weight:700;color:#0a6747}.foot{text-align:center;color:#668071;font-size:12px;margin-top:20px}</style></head><body><header class="head"><div class="shell" style="padding:0"><a href="./">← TotalMarket Academy</a> · COURSE 13</div></header><main class="shell"><h1>Multi-Timeframe Analysis</h1><p class="lead">One focused lesson per screen with an illustrated chart, a practical ₹ example, and a final knowledge check.</p><article class="panel"><div class="meta"><span id="count"></span><span id="label"></span></div><div class="track"><div class="fill" id="fill"></div></div><div id="body" aria-live="polite"></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></article><p class="foot">Illustrative examples only, not live market data or financial advice. Markets carry risk; no strategy guarantees results.</p></main><script>
const lessons=[["Why multiple timeframes?","Higher timeframes provide context; lower timeframes show detailed price behavior. Signals may conflict.","Weekly uptrend above ₹500 can coexist with a 60-minute pullback to ₹510.",[480,490,503,515,508,525,517,533,520,538,541],500],["Weekly structure","Use weekly swing highs and lows to identify the broader directional structure.","Weekly higher lows at ₹400, ₹420 and ₹445 suggest an upward structure.",[400,440,420,460,445,485,470,505,490,520,510],445],["Daily context","Daily levels can reveal pullbacks and zones inside a weekly trend.","Weekly trend rises, but daily price rejects ₹620 three times.",[560,580,600,620,598,618,603,620,595,605,610],620],["60-minute structure","A 60-minute chart can identify local breaks and retests within the larger daily trend.","Daily support ₹300; 60-minute price breaks ₹315 and retests ₹312.",[295,303,309,315,310,319,312,322,318,325,328],315],["Alignment","A setup has multi-timeframe alignment when higher-timeframe direction and lower-timeframe trigger agree.","Weekly higher lows, daily support ₹400 and 60-minute breakout ₹412 align directionally.",[392,400,405,399,408,412,407,417,414,421,425],412],["Conflict","A lower-timeframe bullish break can be countertrend to a bearish weekly structure.","Weekly trend falls; 60-minute bounce from ₹90 to ₹105 may only be a pullback.",[125,117,120,108,112,96,90,99,105,100,94],105],["Invalidation","Define which timeframe supplies the trade idea and where that idea becomes invalid.","60-minute long above ₹210 with invalidation at ₹203; a weekly trend alone does not replace a stop.",[190,199,207,211,206,215,210,219,216,221,224],203],["Practice","Start with weekly context, inspect daily zones, then evaluate a 60-minute trigger.","Weekly bullish; daily support ₹500; 60-minute higher low at ₹503 and break above ₹515.",[495,503,511,505,515,508,503,518,521,517,526],515]];let current=0;const el=id=>document.getElementById(id);
function chart(l){const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 680 345");svg.setAttribute("role","img");svg.setAttribute("aria-label","Illustrative diagram for "+l[0]);const add=(tag,attrs,t)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));if(t!==undefined)n.textContent=t;svg.append(n)};const prices=l[3],level=l[4],lo=Math.min(...prices,level===null?Infinity:level),hi=Math.max(...prices,level===null?-Infinity:level),range=Math.max(12,hi-lo),bottom=lo-range*.2,top=hi+range*.2,x=i=>55+i*53,y=v=>283-(v-bottom)/(top-bottom)*232;add("rect",{width:680,height:345,fill:"#fff"});for(let i=0;i<5;i++){const v=bottom+(top-bottom)*i/4;add("line",{x1:46,y1:y(v),x2:616,y2:y(v),stroke:"#e1e8ed"});add("text",{x:623,y:y(v)+5,fill:"#3b5264","font-size":13},""+Math.round(v))}if(level!==null){add("line",{x1:46,y1:y(level),x2:616,y2:y(level),stroke:"#17202b","stroke-width":2,"stroke-dasharray":"8 6"});add("text",{x:52,y:Math.max(16,y(level)-10),fill:"#17202b","font-size":13,"font-weight":700},"REFERENCE "+level)}add("polyline",{points:prices.map((v,i)=>x(i)+","+y(v)).join(" "),stroke:"#466ce8","stroke-width":5,fill:"none","stroke-linejoin":"round","stroke-linecap":"round"});add("text",{x:50,y:331,fill:"#476274","font-size":12},"EARLIER");add("text",{x:550,y:331,fill:"#476274","font-size":12},"LATER →");const f=document.createElement("figure");f.className="chart";f.append(svg);const cap=document.createElement("figcaption");cap.textContent="Illustrative blue-line diagram; vertical values represent the lesson example, not live prices. Dashed line marks a reference value.";f.append(cap);return f}
function render(){const l=lessons[current];el("count").textContent="STEP "+(current+1)+" OF "+lessons.length;el("label").textContent=l[0];el("fill").style.width=(100*(current+1)/lessons.length)+"%";const body=el("body");body.replaceChildren();const h=document.createElement("h2");h.textContent=l[0];const p=document.createElement("p");p.className="definition";p.textContent=l[1];const ex=document.createElement("aside");ex.className="example";const strong=document.createElement("strong");strong.textContent="→ PRACTICAL ₹ EXAMPLE";const ep=document.createElement("p");ep.textContent=l[2];ex.append(strong,ep);body.append(h,p,chart(l),ex);if(current===7){const q=document.createElement("section");q.className="quiz";const title=document.createElement("h3");title.textContent="Which approach is most reliable?";q.append(title);const feedback=document.createElement("p");feedback.setAttribute("role","status");["One chart signal guarantees a profit","Combine context, predefined risk and evidence","Increase risk after every loss"].forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>feedback.textContent=i===1?"Correct. Evidence, a clear plan and controlled risk matter; outcomes remain uncertain.":"Try again: no single indicator guarantees profit.";q.append(b)});q.append(feedback);body.append(q)}el("prev").disabled=current===0;el("next").textContent=current===7?"Restart ↻":"Next →";window.scrollTo(0,0)}
el("prev").onclick=()=>{if(current>0){current--;render()}};el("next").onclick=()=>{current=(current+1)%lessons.length;render()};render();
</script></body></html>
