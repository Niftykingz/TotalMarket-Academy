<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07503b"><meta name="description" content="Advanced support and resistance course with visual supply demand zones, breakout confirmation and failed retests."><title>Advanced Support & Resistance | TotalMarket Academy</title><link rel="stylesheet" href="styles.css"><style>body{background:#f7faf7;color:#153d2e}.head{background:#07503b;color:white;padding:18px}.head a{color:#c8f5d9;font-weight:800}.shell{max-width:830px;margin:auto;padding:25px 16px 60px}.shell h1{font-size:clamp(28px,5vw,43px);color:#0b4430}.lead{color:#537163;line-height:1.7}.panel{background:white;border:1px solid #d9e7de;border-radius:18px;padding:clamp(18px,4vw,35px);margin-top:22px}.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#597466}.track{background:#e3efe7;height:7px;border-radius:20px;overflow:hidden;margin:14px 0 25px}.fill{background:#138553;height:100%}h2{color:#103e2d}.definition{font-size:17px;line-height:1.7}.chart{border:1px solid #d7e3dd;border-radius:12px;margin:20px 0;padding:4px;background:white}.chart svg{width:100%;height:auto;display:block}.chart figcaption{font-size:12px;color:#526b5d;padding:7px;line-height:1.5}.example{border-left:4px solid #168554;background:#edf8f0;padding:16px;margin:20px 0;border-radius:0 9px 9px 0;line-height:1.7}.example strong{color:#0b6b47}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.nav button,.quiz button{border:1px solid #c4d8ca;background:white;border-radius:9px;padding:13px 19px;font-weight:750;color:#0c4c34}.nav button:last-child{background:#0b6748;color:white}.nav button:disabled{opacity:.4}.quiz button{display:block;width:100%;text-align:left;margin:9px 0}.quiz p{font-weight:700;color:#0a6747}.foot{text-align:center;color:#668071;font-size:12px;margin-top:20px}</style></head><body><header class="head"><div class="shell" style="padding:0"><a href="./">← TotalMarket Academy</a> · COURSE 10</div></header><main class="shell"><h1>Advanced Support & Resistance</h1><p class="lead">One concept per screen. See price zones, breakout confirmation and failed retests on clear, annotated charts.</p><article class="panel"><div class="meta"><span id="count"></span><span id="label"></span></div><div class="track"><div class="fill" id="fill"></div></div><div id="body" aria-live="polite"></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></article><p class="foot">All charts use invented prices. Levels and breakouts are not guaranteed trading signals.</p></main><script>
const lessons=[["Zones, not lines","Support and resistance often work as areas, not exact prices.","₹98–₹102 is a possible support zone after repeated bounces.",[120,110,101,114,99,113,102,118,100,116,122],98,102],["Demand zone","A demand zone is an area where strong buying previously emerged; it does not prove pending orders.","Price bases at ₹200–₹205, rallies to ₹230, then revisits ₹204.",[212,205,202,204,215,228,230,219,208,204,220],200,205],["Supply zone","A supply zone is an area where selling previously emerged, but a later retest may break through.","Price falls from ₹300–₹305 to ₹275, then returns to ₹302.",[284,297,303,301,289,276,275,287,300,302,288],300,305],["Level strength","Clear reactions and strong moves away may make a zone worth watching; repeated tests do not guarantee it holds.","Price rejects ₹148–₹152 three times before another test.",[130,145,150,137,148,150,135,145,151,140,132],148,152],["Multi-timeframe levels","Compare weekly or daily zones with shorter-timeframe price structure.","Weekly resistance ₹490–₹500 aligns with repeated 60-minute rejections around ₹495.",[460,478,494,480,498,483,496,487,502,493,480],490,500],["Breakout confirmation","A close beyond the zone and follow-through can strengthen a breakout interpretation, not guarantee success.","Price closes at ₹126 above ₹118–₹122 resistance and later holds ₹123.",[104,113,121,115,120,119,124,126,123,129,132],118,122],["Failed retest","A failed retest occurs when price cannot sustain the expected response after revisiting a broken level.","Price breaks above ₹120 to ₹128, retests ₹121, then drops to ₹115.",[105,113,119,121,128,124,121,119,115,110,108],118,122],["Practice: which breakout?","A wick above resistance is weaker evidence than a close and subsequent hold above it.","A: high ₹125, close ₹119. B: close ₹126, then ₹127. B has stronger confirmation.",[108,114,121,116,120,123,126,124,127,130,129],118,122]];let current=0;const el=id=>document.getElementById(id);
function chart(l){const [title,definition,example,prices,low,high]=l;const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 680 345");svg.setAttribute("role","img");svg.setAttribute("aria-label","Illustrative price chart for "+title);const add=(tag,attrs,text)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;svg.append(n)};const lo=Math.min(...prices,low),hi=Math.max(...prices,high),range=Math.max(12,hi-lo),min=lo-range*.16,max=hi+range*.16;const x=i=>50+i*55,y=v=>290-(v-min)/(max-min)*240;add("rect",{width:680,height:345,fill:"#fff"});for(let i=0;i<5;i++){let v=min+(max-min)*i/4;add("line",{x1:45,y1:y(v),x2:615,y2:y(v),stroke:"#e1e7eb"});add("text",{x:625,y:y(v)+5,fill:"#334155","font-size":13}, "₹"+Math.round(v))}add("rect",{x:45,y:y(high),width:570,height:Math.max(4,y(low)-y(high)),fill:"#a9dfc3","fill-opacity":.6});[low,high].forEach(v=>add("line",{x1:45,y1:y(v),x2:615,y2:y(v),stroke:"#08754e","stroke-width":2,"stroke-dasharray":"8 6"}));add("polyline",{points:prices.map((v,i)=>x(i)+","+y(v)).join(" "),fill:"none",stroke:"#466ce8","stroke-width":5,"stroke-linejoin":"round","stroke-linecap":"round"});add("text",{x:50,y:Math.max(17,y(high)-12),fill:"#075a3c","font-size":15,"font-weight":700},"ZONE ₹"+low+"–₹"+high);add("text",{x:50,y:330,fill:"#405469","font-size":13},"EARLIER");add("text",{x:552,y:330,fill:"#405469","font-size":13},"LATER →");const f=document.createElement("figure");f.className="chart";f.append(svg);const cap=document.createElement("figcaption");cap.textContent="Blue = price · Green band = price zone · Dashed = zone boundaries.";f.append(cap);return f}
function render(){const l=lessons[current];el("count").textContent="STEP "+(current+1)+" OF "+lessons.length;el("label").textContent=l[0];el("fill").style.width=(100*(current+1)/lessons.length)+"%";const body=el("body");body.replaceChildren();const h=document.createElement("h2");h.textContent=l[0];const p=document.createElement("p");p.className="definition";p.textContent=l[1];const ex=document.createElement("aside");ex.className="example";const strong=document.createElement("strong");strong.textContent="→ PRACTICAL ₹ EXAMPLE";const ep=document.createElement("p");ep.textContent=l[2];ex.append(strong,ep);body.append(h,p,chart(l),ex);if(current===7){const q=document.createElement("section");q.className="quiz";const title=document.createElement("h3");title.textContent="Which provides stronger breakout evidence?";q.append(title);const feedback=document.createElement("p");feedback.setAttribute("role","status");["Wick above zone, close inside","Close above zone and next close holds","Both guarantee a rally"].forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>feedback.textContent=i===1?"Correct. Two closes above the zone offer stronger evidence, but can still fail.":"Try again: focus on closing prices and follow-through.";q.append(b)});q.append(feedback);body.append(q)}el("prev").disabled=current===0;el("next").textContent=current===7?"Restart ↻":"Next →";window.scrollTo(0,0)}
el("prev").onclick=()=>{if(current>0){current--;render()}};el("next").onclick=()=>{current=(current+1)%lessons.length;render()};render();
</script></body></html>
